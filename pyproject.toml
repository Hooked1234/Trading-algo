[project]
name = "event-trader"
version = "0.1.0"
description = "Paper-only event-driven trading research system for SEC 8-K filings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "duckdb>=1.3,<2",
  "exchange-calendars>=4.10,<5",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<21",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "scipy>=1.15,<2",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
ibkr = ["ibapi>=9.81.1.post1"]
dev = [
  "hypothesis>=6.135,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
event-trader = "event_trader.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_trader"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: provider contract tests with recorded or mocked responses",
  "integration: multi-component tests without real orders",
]

[tool.coverage.run]
branch = true
source = ["event_trader"]
omit = [
  "src/event_trader/cli.py",
  "src/event_trader/logging.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 82

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
